services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twinbox-app
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    volumes:
      - ./testing/.data:/app/.data
